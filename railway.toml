[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
# Railway injects $PORT — the Dockerfile CMD already reads it
healthcheckPath = "/health"
healthcheckTimeout = 10
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
type = "web"
name = "ssr-ai-api"

[services.scaling]
minInstances = 1
maxInstances = 5
targetCPUPercent = 70
